    }

    .counter {
      display: block;

      font-size: 0.75rem;
      color: #a08070;
    }

    .form {

    .link-ready { font-size: 0.9rem; color: #a08070; margin-bottom: 0.75rem; }
    .copy-btn {

      background: #d4a090;

      border: none;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;

    .share-btn:hover { background: #c89080; }

    .create-another { font-size: 0.85rem; color: #a08070; text-decoration: none; }

      border-radius: 0.5rem;
      font-family: inherit;

      margin-top: 0.25rem;
    }

    .giphy-block { margin-top: 0.75rem; }
    .giphy-block > label { display: block; margin-bottom: 0.35rem; }
    .giphy-row { display: flex; gap: 0.5rem; align-items: stretch; width: 100%; }
    .giphy-row input { flex: 1; min-width: 0; }
    .giphy-search-btn {
      flex-shrink: 0;
      padding: 0.5rem 0.9rem;

      display: flex;

      justify-content: flex-start;

      padding: 0;

    .giphy-empty,

<body>
  <main class="card">
    <div class="emoji" id="emoji"></div>
    <div class="card-photo" id="cardPhoto"><img id="cardPhotoImg" src="" alt="Photo for you"></div>
    <h1 id="message"></h1>
    <p class="pleasure-label">Today's simple pleasure</p>
    <p class="pleasure" id="pleasure"></p>
    <p class="from-text" id="fromText"></p>
    <div class="link-actions hidden" id="linkActions">
      <p class="link-ready" id="linkReady">Link ready – copy and share</p>
      <div class="link-buttons">
        <button type="button" class="copy-btn" id="copyBtn">Copy link</button>
        <button type="button" class="share-btn hidden" id="shareBtn">Share</button>
      </div>
      <a href="#" class="create-another" id="createAnother">Create another link</a>
    </div>
    <form class="form" id="form">
      <div>
        <label for="to">To (who is this for?)</label>
        <input type="text" id="to" placeholder="Their name" autocomplete="off">
      </div>
      <div>
        <label for="from">From (who is it from?)</label>
        <input type="text" id="from" placeholder="Your name" autocomplete="off">
      </div>
      <div>
        <label for="img">Photo or GIF (optional)</label>
        <input type="url" id="img" placeholder="Paste an image or GIF URL" autocomplete="off">
        <div class="giphy-block">
          <label for="giphySearch">Or search Giphy</label>
          <div class="giphy-row">
            <input type="search" id="giphySearch" placeholder="Search for a GIF…" autocomplete="off">
            <button type="button" class="giphy-search-btn" id="giphySearchBtn">Search</button>
          </div>
          <p class="giphy-hint hidden" id="giphyUnavailable"></p>
          <div class="giphy-results" id="giphyResults" role="list"></div>
        </div>
      </div>
      <div>
        <label for="msg">Custom message (optional)</label>
        <textarea id="msg" placeholder="Write something just for them…" autocomplete="off" maxlength="500"></textarea>
      </div>
      <button type="submit">Create my link</button>
    </form>
    <p class="credit">
      Simple pleasures from <a href="https://www.are.na/alex-singh/a-catalogue-of-simple-pleasures" target="_blank" rel="noopener">Are.na</a><br>
      Developed with ❤️ by <a href="https://rocco.gimondi.com/" target="_blank" rel="noopener">Rocco</a><br>
      <span id="counter" class="counter"></span>
    </p>
  </main>
  <script>
    const messages = [

    ];

    const emojis = ['☀️', '☕', '🌸', '✨', '🌅', '🦋', '🌿', '💛'];
    const pleasures = [

      "A song that takes you back",

      "Someone remembering something you said",
      "The hum of a quiet room",
      "A warm towel after a shower",
      "The last bite of a good meal",
      "Looking up at the sky for no reason",
      "A plant that's still alive",
      "The click of a pen",

      "A clear surface to work on",
      "The quiet after turning off a screen",
    ];

    function getDayOfYear() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const diff = now - start;
      const oneDay = 86400000;
      return Math.floor(diff / oneDay);
    }

    function parseNames() {
      const params = new URLSearchParams(location.search);
      const toParam = params.get('to');
      const fromParam = params.get('from');
      if (toParam || fromParam) return { to: toParam || '', from: fromParam || '' };

      let segment = '';
      if (location.hash) {
        segment = decodeURIComponent(location.hash.slice(1));
      } else {
        const path = location.pathname;
        const parts = path.split('/').filter(Boolean);
        const last = parts[parts.length - 1];
        if (last) segment = decodeURIComponent(last);
      }
      if (!segment) return null;
      if (!segment.includes('+')) return null;
      const plusIndex = segment.lastIndexOf('+');
      const to = segment.slice(0, plusIndex).replace(/\+/g, ' ').trim();
      const from = segment.slice(plusIndex + 1).trim();
      return { to, from };
    }

    function getImageUrl() {
      var url = (new URLSearchParams(location.search)).get('img') || '';
      url = url.trim();
      if (url && (url.indexOf('http://') === 0 || url.indexOf('https://') === 0)) return url;
      return '';
    }

    var COUNTER_KEY = 'goodMorningMessagesCreated';
    function getMessageCount() {
      try {
        var n = parseInt(localStorage.getItem(COUNTER_KEY), 10);
        return isNaN(n) ? 0 : n;
      } catch (e) { return 0; }
    }
    function incrementMessageCount() {
      var n = getMessageCount() + 1;
      try { localStorage.setItem(COUNTER_KEY, String(n)); } catch (e) {}
      return n;
    }
    function isSharedMessageView(names) {
      var customMsg = getCustomMessage();
      return (names && (names.to || names.from)) || !!customMsg;
    }

    function updateCounterDisplay(show) {
      var el = document.getElementById('counter');
      if (!el) return;
      if (!show) {
        el.textContent = '';
        el.classList.add('hidden');
        return;
      }
      el.classList.remove('hidden');
      var n = getMessageCount();
      el.textContent = n + ' message' + (n === 1 ? '' : 's') + ' created';
    }

    function getCustomMessage() {
      var msg = (new URLSearchParams(location.search)).get('msg') || '';
      return msg.trim();
    }

    function buildQuery(imgUrl, customMessage) {
      var params = [];
      if (imgUrl) params.push('img=' + encodeURIComponent(imgUrl));
      if (customMessage) params.push('msg=' + encodeURIComponent(customMessage));
      return params.length ? '?' + params.join('&') : '';
    }

    function buildNamesUrl(to, from, imgUrl, customMessage) {
      var segmentForHash = (to || '').trim() + '+' + (from || '').trim();
      if (segmentForHash === '++') segmentForHash = '';
      var segmentForPath = encodeURIComponent((to || '').trim()).replace(/%20/g, '+') + '+' + encodeURIComponent((from || '').trim()).replace(/%20/g, '+');
      if (segmentForPath === '+') segmentForPath = '';
      var query = buildQuery(imgUrl, customMessage);
      if (location.protocol === 'file:') {
        return location.pathname + query + (segmentForHash ? '#' + encodeURIComponent(segmentForHash) : '');
      }
      var base = location.pathname.replace(/\/[^/]*$/, '') || '/';
      var path = (base.endsWith('/') ? base : base + '/') + segmentForPath;
      return location.origin + path + query;
    }

    const dayOfYear = getDayOfYear();
    const index = dayOfYear % messages.length;
    const emojiEl = document.getElementById('emoji');
    const messageEl = document.getElementById('message');
    const pleasureEl = document.getElementById('pleasure');
    const fromEl = document.getElementById('fromText');
    const formEl = document.getElementById('form');
    const linkActionsEl = document.getElementById('linkActions');
    const copyBtn = document.getElementById('copyBtn');
    const cardPhoto = document.getElementById('cardPhoto');
    const cardPhotoImg = document.getElementById('cardPhotoImg');

    function setPageImage(url) {
      if (url) {
        cardPhoto.classList.add('visible');
        cardPhotoImg.src = url;
      } else {
        cardPhoto.classList.remove('visible');
        cardPhotoImg.removeAttribute('src');
      }
    }

    function updateDisplay(names, showLinkActions) {
      emojiEl.textContent = emojis[index % emojis.length];
      pleasureEl.textContent = pleasures[index];
      var customMsg = getCustomMessage();
      var baseMessage = customMsg || messages[index];
      var showMessageView = (names && (names.to || names.from)) || customMsg;
      if (showMessageView) {
        formEl.classList.add('hidden');
        if (showLinkActions && (names && (names.to || names.from))) linkActionsEl.classList.remove('hidden');
        else linkActionsEl.classList.add('hidden');
        if (!customMsg && names) {
          if (names.from && names.to) {
            baseMessage = names.from + ' wishes you a good morning, ' + names.to + '!';
            fromEl.style.display = 'none';
          } else {
            if (names.to) {
              baseMessage = baseMessage.replace(/sunshine|beautiful|lovely|sweet soul|dear one/gi, names.to);
              if (!baseMessage.includes(names.to)) {
                baseMessage = baseMessage.replace(/^(Good morning|Morning|Hello|Wake up|Rise and shine|Rise and glow)!?/i, (m) => m + ', ' + names.to + '!');
              }
            }
            if (names.from) {
              fromEl.textContent = 'From ' + names.from;
              fromEl.style.display = 'block';
            } else {
              fromEl.style.display = 'none';
            }
          }
        } else if (names && names.from) {
          fromEl.textContent = 'From ' + names.from;
          fromEl.style.display = 'block';
        } else {
          fromEl.style.display = 'none';
        }
        messageEl.textContent = baseMessage;
        if (names && names.from && (customMsg || !names.to)) {
          fromEl.textContent = 'From ' + names.from;
          fromEl.style.display = 'block';
        } else {
          fromEl.style.display = 'none';
        }
      } else {
        linkActionsEl.classList.add('hidden');
        formEl.classList.remove('hidden');
        fromEl.style.display = 'none';
        messageEl.textContent = baseMessage;
      }
    }

    function copyLink() {
      const url = location.href;
      navigator.clipboard.writeText(url).then(function() {
        const label = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(function() { copyBtn.textContent = label; }, 2000);
      });
    }

    copyBtn.addEventListener('click', copyLink);

    const shareBtn = document.getElementById('shareBtn');
    if (navigator.share) {
      shareBtn.classList.remove('hidden');
      shareBtn.addEventListener('click', function() {
        navigator.share({
          title: 'Good Morning',
          text: 'A good morning for you',
          url: location.href
        }).catch(function() {});
      });
    }

    document.getElementById('createAnother').addEventListener('click', function(e) {
      e.preventDefault();
      const base = location.pathname.replace(/\/[^/]+$/, '') || '/';
      location.href = location.origin + (base.endsWith('/') ? base : base + '/');
    });

    var names = parseNames();
    var justCreated = !!sessionStorage.getItem('goodMorningJustCreated');
    if (justCreated) sessionStorage.removeItem('goodMorningJustCreated');
    updateDisplay(names, !!(names && justCreated));
    setPageImage(getImageUrl());
    var showCounter = !isSharedMessageView(names) || justCreated;
    updateCounterDisplay(showCounter);

    function shortenImageUrl(longUrl, cb) {
      if (!longUrl || longUrl.length <= 80) return cb(longUrl);
      fetch(location.origin + '/api/shorten?url=' + encodeURIComponent(longUrl))
        .then(function(r) { return r.json(); })
        .then(function(data) { cb(data.shortUrl || longUrl); })
        .catch(function() { cb(longUrl); });
    }

    function runGiphySearch() {
      var input = document.getElementById('giphySearch');
      var q = (input && input.value || '').trim();
      var resultsEl = document.getElementById('giphyResults');
      var hint = document.getElementById('giphyUnavailable');
      if (!resultsEl) return;
      if (!q) {
        resultsEl.innerHTML = '';
        if (hint) { hint.classList.add('hidden'); hint.textContent = ''; }
        return;
      }
      resultsEl.innerHTML = '<p class="giphy-loading">Searching…</p>';
      if (hint) { hint.classList.add('hidden'); hint.textContent = ''; }
      var origin = location.protocol === 'file:' ? '' : location.origin;
      fetch(origin + '/api/giphy?q=' + encodeURIComponent(q))
        .then(function(r) {
          if (r.status === 503) return { unavailable: true };
          if (!r.ok) throw new Error('bad');
          return r.json();
        })
        .then(function(data) {
          if (data.unavailable) {
            if (hint) {
              hint.textContent = 'GIF search needs GIPHY_API_KEY on the server. You can still paste a GIF URL above.';
              hint.classList.remove('hidden');
            }
            resultsEl.innerHTML = '';
            return;
          }
          var gifs = data.gifs || [];
          if (!gifs.length) {
            resultsEl.innerHTML = '<p class="giphy-empty">No GIFs found. Try another search.</p>';
            return;
          }
          resultsEl.innerHTML = '';
          gifs.forEach(function(g) {
            if (!g.url) return;
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'giphy-thumb';
            btn.setAttribute('aria-label', 'Use this GIF');
            var img = document.createElement('img');
            img.src = g.preview || g.url;
            img.alt = g.title || '';
            img.loading = 'lazy';
            btn.appendChild(img);
            btn.addEventListener('click', function() {
              var imgInput = document.getElementById('img');
              if (imgInput) imgInput.value = g.url;
              resultsEl.querySelectorAll('.giphy-thumb').forEach(function(b) { b.classList.remove('selected'); });
              btn.classList.add('selected');
            });
            resultsEl.appendChild(btn);
          });
        })
        .catch(function() {
          resultsEl.innerHTML = '<p class="giphy-empty">Could not search. Try again or paste a URL.</p>';
        });
    }

    var giphyBtn = document.getElementById('giphySearchBtn');
    var giphyInput = document.getElementById('giphySearch');
    if (giphyBtn) giphyBtn.addEventListener('click', runGiphySearch);
    if (giphyInput) {
      giphyInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          runGiphySearch();
        }
      });
    }

    if (!names || (!names.to && !names.from)) {
      formEl.addEventListener('submit', function(e) {
        e.preventDefault();
        var to = document.getElementById('to').value.trim();
        var from = document.getElementById('from').value.trim();
        var imgUrl = (document.getElementById('img').value || '').trim();
        var customMessage = (document.getElementById('msg').value || '').trim().slice(0, 500);
        if (imgUrl && imgUrl.indexOf('http://') !== 0 && imgUrl.indexOf('https://') !== 0) imgUrl = '';
        if (!to && !from && !customMessage) return;
        incrementMessageCount();
        updateCounterDisplay(true);
        if (location.protocol === 'file:') {
          var segHash = (to || '').trim() + '+' + (from || '').trim();
          if (segHash === '++') segHash = '';
          var query = buildQuery(imgUrl, customMessage);
          var hash = segHash ? '#' + encodeURIComponent(segHash) : '';
          location.href = location.pathname + query + hash;
          updateDisplay(parseNames(), true);
          setPageImage(getImageUrl());
          copyBtn.focus();
        } else if (imgUrl) {
          var btn = formEl.querySelector('button[type="submit"]');
          var origText = btn.textContent;
          btn.textContent = 'Shortening…';
          btn.disabled = true;
          shortenImageUrl(imgUrl, function(shortUrl) {
            btn.textContent = origText;
            btn.disabled = false;
            sessionStorage.setItem('goodMorningJustCreated', '1');
            location.href = buildNamesUrl(to, from, shortUrl, customMessage);
          });
        } else {
          sessionStorage.setItem('goodMorningJustCreated', '1');
          location.href = buildNamesUrl(to, from, imgUrl, customMessage);
        }
      });
    }
  </script>
</body>
</html>
